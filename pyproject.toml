[project]
name = "mcp-server-openfda"
version = "0.1.0"
description = "MCP server exposing openFDA pharmacovigilance data (FAERS adverse events, drug labels, drug recalls) as structured tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.0",
]

[project.scripts]
mcp-server-openfda = "mcp_server_openfda:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
